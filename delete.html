<!DOCTYPE html>

<head>

  <link

    sizes="32x32"
    rel="icon"
    href="images.png"

      <h1 id="nav_title">ITSM Ticketing Tool</h1>
    </a>

    <div class="nav_container">

      <label for="theme_check" class="themebtn">
        <button class="dark_mode" id="theme_check">
          <i class="fa-regular fa-moon"></i>
        </button>
      </label>

      <input type="checkbox" name="checkbox" id="check" />

      <label for="check" class="menubtn">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </label>

      <ul class="nav_list">

        <h2>Ticket Administration</h2>

        <li class="nav_link">
          <a href="create.html">
            <i class="fa-regular fa-clone"></i>
            Create New Ticket
          </a>
        </li>

        <li class="nav_link">
          <a href="view.html">
            <i class="fa-regular fa-eye"></i>
            View Ticket
          </a>
        </li>

        <li class="nav_link">
          <a href="search.html">
            <i class="fa-regular fa-folder-open"></i>
            Search Ticket
          </a>
        </li>

        <li class="nav_link">
          <a href="update.html">
            <i class="fa-regular fa-pen-to-square"></i>
            Update Ticket
          </a>
        </li>

        <li class="nav_link">
          <a href="delete.html">
            <i class="fa-regular fa-rectangle-xmark"></i>
            Delete Ticket
          </a>
        </li>

        <h2>Analytis and Insights</h2>

        <li class="nav_link">
          <a href="summary.html">
            <i class="fa-regular fa-chart-bar"></i>
            Generate Ticket Summary
          </a>
        </li>

      </ul>
    </div>

  </nav>
  <!-- End of Navigation -->


  <!-- Start of Main Container -->
  <main>

    <section id="new_ticket">

      <!-- Delete Ticket Header -->
      <div id="header">
        <h1>Delete Ticket</h1>
      </div>


      <!-- Delete Ticket Form -->
      <section id="grid-input" class="search-ticket">

        <div class="input_cards">
          <p>Ticket Number:</p>
          <input
            type="text"
            name="ticket_number"
            id="ticket_number"
            value=""
            class="ticket_details"
          />
        </div>

        <div class="forms_button">
          <button type="submit" class="createbtn">Search Ticket Number</button>
         <a href="index.html"><button type="submit" class="cancelbtn">Exit to Main Menu</button></a>
        </div>

      </section>

    </section>

  </main>
  <!-- End of Main Container -->
